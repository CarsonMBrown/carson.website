<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fullscreen GIF</title>
  <script>
    // Merge this logic into your existing 404.html if you already have one.
    // QR codes can only hold uppercase paths (e.g. HTTPS://CARSON.WEBSITE/S/ABC...),
    // but GitHub Pages paths are case-sensitive, so those land here as a 404.
    // Forward them to the real tool, which decodes them.
    (function () {
      var BASE = "/s/"; // keep in sync with BASE in s/main.js
      var path = location.pathname;
      if (path.toLowerCase().indexOf(BASE) === 0 && path.length > BASE.length) {
        var payload = decodeURIComponent(path.slice(BASE.length));
        location.replace(BASE + "?qr=" + encodeURIComponent(payload));
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* key line */
    }
  </style>
</head>

<body>
  <div class="bg">
    <img src="images/no-memory.gif" alt="background">
  </div>
</body>
</html>
