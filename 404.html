<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fullscreen GIF</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* key line */
    }
  </style>
</head>

<body>
  <div class="bg">
    <img src="images/no-memory.gif" alt="background">
  </div>
</body>
</html>
